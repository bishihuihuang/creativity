<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>决策矩阵·加权决策辅助｜创意引擎</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon-48.png">
    <link rel="canonical" href="https://bishihuihuang.github.io/creativity/7.html">
    <style>
        .opt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 12px; }
        .opt-card { border: 1px solid var(--zl-border); border-radius: 12px; padding: 12px 14px; background: var(--zl-card-2); }
        .opt-card .hd { display: flex; align-items: center; gap: 8px; }
        .opt-card input { flex: 1; }
        .cri-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .cri-row .nm { flex: 1; min-width: 120px; }
        .score-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
        .score-table th, .score-table td { border: 1px solid var(--zl-border); padding: 8px 10px; text-align: center; }
        .score-table th { background: var(--zl-card-2); color: var(--zl-dim); font-weight: 600; font-size: 12px; }
        .score-table input { width: 64px; text-align: center; }
        .score-table .opt-name { text-align: left; font-weight: 700; color: var(--zl-text); white-space: nowrap; }
        .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; font-size: 13px; font-weight: 700; margin-right: 8px; }
        .rank-1 { background: linear-gradient(135deg,#f6c945,#e8a020); color: #fff; }
        .rank-2 { background: linear-gradient(135deg,#a5b4c8,#7a8ba1); color: #fff; }
        .rank-3 { background: linear-gradient(135deg,#c9a36a,#a97b3e); color: #fff; }
        .rank-n { background: var(--zl-card-2); color: var(--zl-dim); }
        .bar-wrap { height: 8px; border-radius: 6px; background: var(--zl-card-2); overflow: hidden; margin-top: 6px; }
        .bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--zl-accent), var(--zl-accent-2)); transition: width .3s; }
        .sensitivity-bar { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-top: 6px; color: var(--zl-text); }
        .sensitivity-bar .score { min-width: 52px; text-align: right; font-weight: 700; }
    </style>

    <link rel="stylesheet" href="common.css">
    <script>
        try {
            var _ct = localStorage.getItem('cy_theme');
            var _ok = ['dark','blue','gold','light','milk','guofeng','snowsun','cyber','aurora','custom'];
            if (_ct && _ok.indexOf(_ct) >= 0) { document.documentElement.setAttribute('data-theme', _ct); }
        } catch (e) {}
    </script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="创意引擎">
    <meta name="description" content="加权决策矩阵：多方案 × 多标准打分，自动计算加权总分与排名，支持权重敏感性分析，让选择有据可依。">
    <link rel="stylesheet" href="common.css">
    <script defer src="common.js"></script>
    <script defer src="theme.js"></script>
    <script defer src="cy-features.js"></script>
</head>
<body>

    <div class="bg-animation">
        <div class="bg-flow-1"></div>
        <div class="bg-flow-2"></div>
        <div class="bg-flow-3"></div>
    </div>

    <header class="cy-shell">
        <h1>创意引擎 · 决策矩阵</h1>
    </header>

    <main class="cy-page">
        <div class="cy-card">
            <h2>⚖️ 加权决策矩阵</h2>
            <div class="sub">把你的纠结量化：列出方案与标准，给每项标准定权重（越大越重要），逐格打分，系统自动算加权总分与排名。</div>

            <h2 style="margin-top:6px;">📋 方案（待选项）</h2>
            <div class="opt-grid" id="optGrid"></div>
            <div class="cy-toolbar" style="margin-top:10px;">
                <button class="cy-btn cy-btn-sm" id="btnAddOpt">＋ 添加方案</button>
                <button class="cy-btn cy-btn-sm cy-btn-ghost" id="btnExample">🧪 载入示例</button>
                <button class="cy-btn cy-btn-sm cy-btn-ghost" id="btnClear">🧹 清空</button>
            </div>

            <h2 style="margin-top:18px;">📏 标准与权重</h2>
            <div id="criBox"></div>
            <div class="cy-toolbar" style="margin-top:10px;">
                <button class="cy-btn cy-btn-sm" id="btnAddCri">＋ 添加标准</button>
            </div>
        </div>

        <div class="cy-card">
            <h2>📊 打分矩阵</h2>
            <div class="sub">每格填 0-10 分。行 = 方案，列 = 标准。</div>
            <div id="matrixWrap"></div>
        </div>

        <div class="cy-card">
            <h2>🏆 决策结果</h2>
            <div id="resultWrap">
                <div class="sub" style="color:var(--zl-dim);">尚未计算——填好矩阵后点下方按钮。</div>
            </div>
            <div class="cy-toolbar" style="margin-top:12px;">
                <button class="cy-btn" id="btnCalc">🧮 计算加权得分</button>
                <button class="cy-btn cy-btn-ghost" id="btnSens">🔄 权重敏感性分析</button>
                <button class="cy-btn cy-btn-ghost" id="btnExport">📄 导出决策表</button>
            </div>
            <div id="sensWrap" style="margin-top:14px;"></div>
        </div>
    </main>

    <script>
    /* ========== 决策矩阵引擎 ========== */
    var state = {
        opts: [],   // 方案名
        cris: [],   // 标准名
        w: [],      // 权重
        scores: {}, // optIdx -> { criIdx: score }
        count: 0    // 本会话计算次数（成就 decide_5）
    };

    function ensureScores() {
        state.scores = {};
        for (var i = 0; i < state.opts.length; i++) state.scores[i] = {};
    }

    /* ---------- 方案编辑 ---------- */
    function renderOpts() {
        var g = document.getElementById('optGrid');
        g.innerHTML = '';
        state.opts.forEach(function (name, i) {
            var card = document.createElement('div');
            card.className = 'opt-card';
            var hd = document.createElement('div');
            hd.className = 'hd';
            var em = document.createElement('span');
            em.textContent = '📌';
            var inp = document.createElement('input');
            inp.className = 'cy-input';
            inp.value = name;
            inp.placeholder = '方案 ' + (i + 1);
            inp.onchange = function () { state.opts[i] = this.value.trim() || ('方案 ' + (i + 1)); renderMatrix(); };
            var del = document.createElement('button');
            del.className = 'cy-btn cy-btn-sm cy-btn-ghost';
            del.textContent = '🗑';
            del.onclick = function () {
                state.opts.splice(i, 1);
                ensureScores();
                renderOpts();
                renderMatrix();
            };
            hd.appendChild(em); hd.appendChild(inp); hd.appendChild(del);
            card.appendChild(hd);
            g.appendChild(card);
        });
        renderMatrix();
    }
    function addOpt(name) {
        state.opts.push(name || ('方案 ' + (state.opts.length + 1)));
        ensureScores();
        renderOpts();
    }

    /* ---------- 标准编辑 ---------- */
    function renderCris() {
        var box = document.getElementById('criBox');
        box.innerHTML = '';
        state.cris.forEach(function (name, i) {
            var row = document.createElement('div');
            row.className = 'cri-row';
            var nm = document.createElement('input');
            nm.className = 'cy-input nm';
            nm.value = name;
            nm.placeholder = '标准 ' + (i + 1);
            nm.onchange = function () { state.cris[i] = this.value.trim() || ('标准 ' + (i + 1)); renderMatrix(); };
            var wLab = document.createElement('span');
            wLab.style.cssText = 'font-size:12px;color:var(--zl-dim);white-space:nowrap;';
            wLab.textContent = '权重';
            var wInp = document.createElement('input');
            wInp.className = 'cy-input';
            wInp.type = 'number';
            wInp.min = '0';
            wInp.max = '10';
            wInp.value = state.w[i];
            wInp.style.width = '64px';
            wInp.onchange = function () {
                var v = Math.min(10, Math.max(0, parseFloat(this.value) || 0));
                state.w[i] = v;
                this.value = v;
                renderMatrix();
            };
            var wPct = document.createElement('span');
            wPct.id = 'wPct' + i;
            wPct.style.cssText = 'font-size:12px;color:var(--zl-accent);min-width:44px;text-align:right;';
            var del = document.createElement('button');
            del.className = 'cy-btn cy-btn-sm cy-btn-ghost';
            del.textContent = '🗑';
            del.onclick = function () {
                state.cris.splice(i, 1);
                state.w.splice(i, 1);
                ensureScores();
                renderCris();
                renderMatrix();
            };
            row.appendChild(nm);
            row.appendChild(wLab); row.appendChild(wInp);
            row.appendChild(wPct);
            row.appendChild(del);
            box.appendChild(row);
        });
        // 权重占比提示
        var total = state.w.reduce(function (a, b) { return a + b; }, 0) || 1;
        for (var i = 0; i < state.w.length; i++) {
            var pct = document.getElementById('wPct' + i);
            if (pct) pct.textContent = Math.round(state.w[i] / total * 100) + '%';
        }
    }
    function addCri(name) {
        state.cris.push(name || ('标准 ' + (state.cris.length + 1)));
        state.w.push(1);
        ensureScores();
        renderCris();
        renderMatrix();
    }

    /* ---------- 打分矩阵 ---------- */
    function renderMatrix() {
        var wrap = document.getElementById('matrixWrap');
        if (!state.opts.length || !state.cris.length) {
            wrap.innerHTML = '<div class="sub" style="color:var(--zl-dim);">需要至少 1 个方案与 1 个标准，才能生成打分矩阵。</div>';
            return;
        }
        var html = '<table class="score-table"><thead><tr><th>方案 \\ 标准</th>';
        state.cris.forEach(function (c) { html += '<th>' + escapeHtml(c) + '<br><span style="font-weight:400;font-size:11px;">w=' + state.w[state.cris.indexOf(c)] + '</span></th>'; });
        html += '</tr></thead><tbody>';
        state.opts.forEach(function (o, i) {
            html += '<tr><td class="opt-name">' + escapeHtml(o) + '</td>';
            state.cris.forEach(function (c, j) {
                var v = state.scores[i] && state.scores[i][j] != null ? state.scores[i][j] : '';
                html += '<td><input data-oi="' + i + '" data-ci="' + j + '" type="number" min="0" max="10" value="' + v + '" placeholder="–"></td>';
            });
            html += '</tr>';
        });
        html += '</tbody></table>';
        wrap.innerHTML = html;
        wrap.querySelectorAll('input').forEach(function (inp) {
            inp.addEventListener('change', function () {
                var v = Math.min(10, Math.max(0, parseFloat(this.value) || 0));
                this.value = v || '';
                if (!state.scores[+this.dataset.oi]) state.scores[+this.dataset.oi] = {};
                state.scores[+this.dataset.oi][+this.dataset.ci] = v;
            });
        });
    }
    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
    }

    /* ---------- 加权计算 ---------- */
    function calc() {
        var results = [];
        var wTotal = state.w.reduce(function (a, b) { return a + b; }, 0) || 1;
        state.opts.forEach(function (o, i) {
            var sum = 0, filled = 0;
            state.cris.forEach(function (c, j) {
                var v = state.scores[i] && state.scores[i][j] ? state.scores[i][j] : 0;
                sum += v * state.w[j];
                if (state.scores[i] && state.scores[i][j] != null) filled++;
            });
            results.push({ idx: i, name: o, score: sum, w: wTotal, filled: filled });
        });
        results.sort(function (a, b) { return b.score - a.score; });
        return { results: results, wTotal: wTotal };
    }
    function renderResult() {
        var r = calc();
        var wrap = document.getElementById('resultWrap');
        if (!r.results.length) { wrap.innerHTML = '<div class="sub" style="color:var(--zl-dim);">暂无数据</div>'; return; }
        var maxScore = r.results.length ? r.results[0].score : 1;
        var html = '';
        r.results.forEach(function (res, rank) {
            var badge = rank === 0 ? 'rank-1' : rank === 1 ? 'rank-2' : rank === 2 ? 'rank-3' : 'rank-n';
            var pct = maxScore ? Math.round(res.score / maxScore * 100) : 0;
            html += '<div style="padding:10px 0;border-bottom:1px solid var(--zl-border);">' +
                '<span class="rank-badge ' + badge + '">' + (rank + 1) + '</span>' +
                '<b style="font-size:15px;color:var(--zl-text);">' + escapeHtml(res.name) + '</b>' +
                '<span style="float:right;font-size:15px;font-weight:700;color:var(--zl-accent);">' + res.score.toFixed(1) + ' 分</span>' +
                '<div class="bar-wrap"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
                '<div style="font-size:11px;color:var(--zl-dim);margin-top:4px;">已打分 ' + res.filled + '/' + state.cris.length + ' 项 · 加权总分（权重合计 ' + res.w + '）</div>' +
                '</div>';
        });
        if (r.results.length > 1) {
            var gap = r.results[0].score - r.results[1].score;
            html += '<div style="margin-top:12px;font-size:13px;color:var(--zl-text);">' +
                '<b>解读：</b>第一名领先第二名 <b style="color:var(--zl-accent);">' + gap.toFixed(1) + ' 分</b>。' +
                (gap < 2 ? '差距很小——建议调整权重或补充标准再验证一次，避免被「差不多」误导。' : '差距明显，可放心推进第一名方案。') +
                '</div>';
        }
        wrap.innerHTML = html;
    }

    /* ---------- 敏感性分析 ---------- */
    function renderSensitivity() {
        var base = calc();
        if (!base.results.length) { CY.showToast('请先添加方案与标准'); return; }
        var wrap = document.getElementById('sensWrap');
        var html = '<div style="font-size:14px;font-weight:700;color:var(--zl-text);margin-bottom:6px;">🔄 权重敏感性：放大某一标准，看排名是否会翻转</div>';
        state.cris.forEach(function (c, j) {
            // 复制 scores 并翻倍该标准权重
            var scores2 = {};
            for (var i = 0; i < state.opts.length; i++) { scores2[i] = state.scores[i] || {}; }
            var w2 = state.w.slice();
            w2[j] = Math.min(10, w2[j] * 2);
            var wTotal2 = w2.reduce(function (a, b) { return a + b; }, 0) || 1;
            var tmp = [];
            state.opts.forEach(function (o, i) {
                var sum = 0;
                state.cris.forEach(function (c2, j2) { sum += (scores2[i][j2] || 0) * w2[j2]; });
                tmp.push({ name: o, score: sum });
            });
            tmp.sort(function (a, b) { return b.score - a.score; });
            var flipped = tmp[0].name !== base.results[0].name;
            html += '<div class="sensitivity-bar"><span style="flex:1;min-width:0;">放大「' + escapeHtml(c) + '」×2</span>' +
                '<span class="score">' + escapeHtml(tmp[0].name) + '</span>' +
                '<span class="score" style="color:' + (flipped ? '#f43f5e' : '#16a34a') + ';font-size:12px;">' + (flipped ? '⚠ 排名翻转' : '✓ 稳居第一') + '</span></div>';
        });
        wrap.innerHTML = html;
    }

    /* ---------- 导出 ---------- */
    function exportTable() {
        var r = calc();
        if (!r.results.length) { CY.showToast('请先添加方案与标准'); return; }
        var lines = ['# 决策矩阵分析表', '', '## 方案', ''];
        state.opts.forEach(function (o, i) { lines.push((i + 1) + '. ' + o); });
        lines.push('', '## 标准与权重', '');
        state.cris.forEach(function (c, j) { lines.push('- ' + c + '（权重 ' + state.w[j] + '）'); });
        lines.push('', '## 打分矩阵', '');
        lines.push('| 方案 | ' + state.cris.map(escapeHtml).join(' | ') + ' |');
        lines.push('| --- | ' + state.cris.map(function () { return '---'; }).join(' | ') + ' |');
        state.opts.forEach(function (o, i) {
            lines.push('| ' + escapeHtml(o) + ' | ' + state.cris.map(function (c, j) { return state.scores[i][j] != null ? state.scores[i][j] : '–'; }).join(' | ') + ' |');
        });
        lines.push('', '## 加权得分排名', '');
        r.results.forEach(function (res, k) { lines.push((k + 1) + '. ' + res.name + '：' + res.score.toFixed(1) + ' 分'); });
        var text = lines.join('\n');
        try {
            navigator.clipboard.writeText(text).then(function () { CY.showToast('📄 决策表已复制'); }).catch(function () { CY.download('decision-matrix.md', text, 'text/markdown'); });
        } catch (e) { CY.download('decision-matrix.md', text, 'text/markdown'); }
    }

    /* ---------- 示例 ---------- */
    function loadExample() {
        state.opts = ['方案 A：自主开发', '方案 B：外包协作', '方案 C：购买现成'];
        state.cris = ['成本', '周期', '质量', '灵活性'];
        state.w = [4, 3, 5, 2];
        state.scores = {
            0: { 0: 6, 1: 4, 2: 8, 3: 7 },
            1: { 0: 8, 1: 7, 2: 6, 3: 5 },
            2: { 0: 9, 1: 8, 2: 5, 3: 3 }
        };
        renderOpts();
        renderCris();
        renderMatrix();
        renderResult();
        CY.showToast('🧪 已载入示例：为「做产品」决策打分');
    }

    /* ---------- 事件绑定与初始化 ---------- */
    document.getElementById('btnAddOpt').onclick = function () { addOpt(); };
    document.getElementById('btnAddCri').onclick = function () { addCri(); };
    document.getElementById('btnExample').onclick = loadExample;
    document.getElementById('btnClear').onclick = function () {
        if (!state.opts.length && !state.cris.length) return;
        state.opts = []; state.cris = []; state.w = [];
        state.scores = {};
        renderOpts(); renderCris(); renderMatrix();
        document.getElementById('resultWrap').innerHTML = '<div class="sub" style="color:var(--zl-dim);">已清空。</div>';
        document.getElementById('sensWrap').innerHTML = '';
    };
    document.getElementById('btnCalc').onclick = function () {
        renderResult();
        state.count++;
        if (state.count >= 5) CY.unlock('decide_5');
        if (typeof CY.activity === 'object' && CY.activity.add) CY.activity.add({ type: 'decide', page: '7.html' });
    };
    document.getElementById('btnSens').onclick = renderSensitivity;
    document.getElementById('btnExport').onclick = exportTable;

    addOpt('方案 A');
    addOpt('方案 B');
    addCri('标准 1');
    addCri('标准 2');
    if (typeof CY.activity === 'object' && CY.activity.add) CY.activity.add({ type: 'open_tool', page: '7.html' });
    </script>
</body>
</html>
