<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配色灵感·调色板与对比度｜创意引擎</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon-48.png">
    <link rel="canonical" href="https://bishihuihuang.github.io/creativity/5.html">
    <style>
        .pal-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 12px; }
        .pal-card { border: 1px solid var(--zl-border); border-radius: 12px; overflow: hidden; background: var(--zl-card-2); cursor: pointer; transition: transform .15s, box-shadow .15s; }
        .pal-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
        .pal-swatches { display: flex; height: 74px; }
        .pal-swatch { flex: 1; position: relative; }
        .pal-swatch b { position: absolute; left: 4px; bottom: 4px; font-size: 10px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); font-weight: 600; }
        .pal-info { padding: 10px 12px; }
        .pal-name { font-size: 14px; font-weight: 700; color: var(--zl-text); }
        .pal-desc { font-size: 12px; color: var(--zl-dim); margin-top: 3px; line-height: 1.6; }
        .pal-actions { display: flex; gap: 6px; padding: 0 12px 10px; }
        .hex-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
        .hex-item { width: 68px; text-align: center; font-size: 11px; color: var(--zl-dim); }
        .hex-item .chip { height: 42px; border-radius: 8px; border: 1px solid var(--zl-border); margin-bottom: 4px; cursor: pointer; }
        .ct-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .ct-swatch { width: 56px; height: 42px; border-radius: 8px; border: 1px solid var(--zl-border); }
        .ct-result { font-size: 13px; line-height: 1.9; color: var(--zl-text); margin-top: 10px; }
        .ct-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-right: 6px; }
        .badge-pass { background: #16a34a; color: #fff; }
        .badge-fail { background: #dc2626; color: #fff; }
        .badge-large { background: #6366f1; color: #fff; }
        .ct-sample { padding: 14px 18px; border-radius: 10px; margin-top: 10px; font-size: 14px; line-height: 1.8; }
    </style>

    <link rel="stylesheet" href="common.css">
    <script>
        try {
            var _ct = localStorage.getItem('cy_theme');
            var _ok = ['dark','blue','gold','light','milk','guofeng','snowsun','cyber','aurora','custom'];
            if (_ct && _ok.indexOf(_ct) >= 0) { document.documentElement.setAttribute('data-theme', _ct); }
        } catch (e) {}
    </script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="创意引擎">
    <meta name="description" content="HSL 色彩科学配色：六种和谐算法一键生成调色板，WCAG 对比度检测器验证文字可读性，支持导出 CSS 变量。">
    <link rel="stylesheet" href="common.css">
    <script defer src="common.js"></script>
    <script defer src="theme.js"></script>
    <script defer src="cy-features.js"></script>
</head>
<body>

    <div class="bg-animation">
        <div class="bg-flow-1"></div>
        <div class="bg-flow-2"></div>
        <div class="bg-flow-3"></div>
    </div>

    <header class="cy-shell">
        <h1>创意引擎 · 配色灵感</h1>
    </header>

    <main class="cy-page">
        <div class="cy-card">
            <h2>🎨 调色板工厂</h2>
            <div class="sub">从一个基准色出发，用色彩科学的和谐算法生成成套配色。点击色块即可复制，点方案卡片可收藏。</div>
            <div class="cy-toolbar">
                <input type="color" id="baseColor" value="#6366f1" style="width:56px;height:40px;border:none;background:none;cursor:pointer;padding:0;">
                <input class="cy-input" id="baseHex" value="#6366f1" maxlength="7" style="width:110px;text-transform:uppercase;" placeholder="#6366f1">
                <button class="cy-btn" id="btnGen">🎲 随机灵感</button>
                <button class="cy-btn cy-btn-ghost" id="btnFavs">⭐ 收藏夹</button>
            </div>
            <div class="pal-row" id="palRow"></div>
        </div>

        <div class="cy-card">
            <h2>📏 WCAG 对比度检测</h2>
            <div class="sub">按 WCAG 2.1 相对亮度公式计算对比度，检测前景/背景组合是否满足 AA（正文 4.5:1）与 AAA（7:1）标准。</div>
            <div class="ct-row">
                <span style="font-size:13px;color:var(--zl-dim);">前景</span>
                <input type="color" id="fgColor" value="#ffffff" style="width:56px;height:40px;border:none;background:none;cursor:pointer;padding:0;">
                <input class="cy-input" id="fgHex" value="#ffffff" maxlength="7" style="width:110px;text-transform:uppercase;">
                <span style="font-size:13px;color:var(--zl-dim);">背景</span>
                <input type="color" id="bgColor" value="#6366f1" style="width:56px;height:40px;border:none;background:none;cursor:pointer;padding:0;">
                <input class="cy-input" id="bgHex" value="#6366f1" maxlength="7" style="width:110px;text-transform:uppercase;">
                <button class="cy-btn" id="btnPick">🖱 取调色板色</button>
            </div>
            <div class="ct-result" id="ctResult"></div>
            <div class="ct-sample" id="ctSample">创意引擎 · 灵感永不熄火<br>对比度是设计的呼吸</div>
        </div>
    </main>

    <script>
    /* ========== HSL 色彩科学引擎 ========== */
    var _palGen = 0;          // 本会话生成方案计数（成就 palette_10：生成 + 收藏均计入）

    function hexToRgb(h) {
        h = String(h || '').replace('#', '');
        if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
        var v = parseInt(h, 16);
        return [v >> 16 & 255, v >> 8 & 255, v & 255];
    }
    function rgbToHex(r, g, b) {
        function c(n) { return Math.round(Math.min(255, Math.max(0, n))).toString(16).padStart(2, '0'); }
        return '#' + c(r) + c(g) + c(b);
    }
    function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
        var h = 0, s = 0, l = (mx + mn) / 2;
        if (d !== 0) {
            s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
            if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
            else if (mx === g) h = (b - r) / d + 2;
            else h = (r - g) / d + 4;
            h *= 60;
        }
        return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
    }
    function hslToRgb(h, s, l) {
        h = ((h % 360) + 360) % 360; s = s / 100; l = l / 100;
        var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
        var r = 0, g = 0, b = 0;
        if (h < 60) { r = c; g = x; }
        else if (h < 120) { r = x; g = c; }
        else if (h < 180) { g = c; b = x; }
        else if (h < 240) { g = x; b = c; }
        else if (h < 300) { r = x; b = c; }
        else { r = c; b = x; }
        return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
    }
    function hslHex(h, s, l) { var c = hslToRgb(h, s, l); return rgbToHex(c[0], c[1], c[2]); }

    /* 六种和谐算法：输入基准色 hsl，输出 5 色方案 [{hex, h, s, l}] */
    function harmonize(h, s, l) {
        var S = Math.min(100, Math.max(0, s)), L = Math.min(92, Math.max(8, l));
        var schemes = [
            { name: '同类色', desc: '同一色相，明暗节奏变化 —— 稳重的「单色系」',
              cols: [[0, S, L], [0, S, L + 16], [0, S, L - 16], [0, Math.max(8, S - 22), L + 26], [0, Math.min(100, S + 14), L - 22]] },
            { name: '邻近色', desc: '色环相邻 30° —— 和谐的「邻家系」',
              cols: [[0, S, L], [30, S, L], [-30, S, L], [30, S, L + 14], [-30, S, L - 12]] },
            { name: '互补色', desc: '色环正对 180° —— 强对比的「戏剧系」',
              cols: [[0, S, L], [180, S, L], [0, S, L + 18], [180, S, L + 18], [0, Math.max(6, S - 30), L + 30]] },
            { name: '分裂互补', desc: '互补色两侧 150°/210° —— 柔和版的「优雅系」',
              cols: [[0, S, L], [150, S, L], [210, S, L], [0, S, L + 16], [150, S, L - 14]] },
            { name: '三角色', desc: '色环三等分 120° —— 活泼的「均衡系」',
              cols: [[0, S, L], [120, S, L], [240, S, L], [0, S, L + 16], [240, S, L - 12]] },
            { name: '四方色', desc: '色环四等分 90° —— 丰富的「饱满系」',
              cols: [[0, S, L], [90, S, L], [180, S, L], [270, S, L], [0, S, L - 18]] }
        ];
        return schemes.map(function (sc) {
            var colors = sc.cols.map(function (c) {
                var hex = hslHex(h + c[0], c[1], c[2]);
                return { hex: hex, h: (h + c[0] + 360) % 360, s: c[1], l: c[2] };
            });
            return { name: sc.name, desc: sc.desc, colors: colors };
        });
    }

    /* WCAG 相对亮度与对比度 */
    function luminance(rgb) {
        function lin(c) {
            c /= 255;
            return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        }
        return 0.2126 * lin(rgb[0]) + 0.7152 * lin(rgb[1]) + 0.0722 * lin(rgb[2]);
    }
    function contrastRatio(fg, bg) {
        var l1 = luminance(fg), l2 = luminance(bg);
        var a = Math.max(l1, l2), b = Math.min(l1, l2);
        return (a + 0.05) / (b + 0.05);
    }
    function ratingOf(ratio) {
        if (ratio >= 7) return { badge: 'AAA', cls: 'badge-large', txt: '卓越：满足 AAA 级（7:1），几乎所有人群舒适可读' };
        if (ratio >= 4.5) return { badge: 'AA', cls: 'badge-pass', txt: '良好：满足 AA 级（4.5:1），常规正文可用' };
        if (ratio >= 3) return { badge: 'AA大', cls: 'badge-pass', txt: '达标：满足 AA 级大字号（3:1），可用于 ≥18px 大文本' };
        return { badge: '未过', cls: 'badge-fail', txt: '未达标：对比度不足，请加深前景或提亮背景' };
    }

    /* ========== 渲染 ========== */
    function renderPalettes(baseHex) {
        var rgb = hexToRgb(baseHex);
        var hsl = rgbToHsl(rgb[0], rgb[1], rgb[2]);
        var list = harmonize(hsl[0], hsl[1], hsl[2]);
        var row = document.getElementById('palRow');
        row.innerHTML = '';
        list.forEach(function (sc, i) {
            var card = document.createElement('div');
            card.className = 'pal-card';
            var sw = document.createElement('div');
            sw.className = 'pal-swatches';
            sc.colors.forEach(function (c) {
                var d = document.createElement('div');
                d.className = 'pal-swatch';
                d.style.background = c.hex;
                var b = document.createElement('b');
                b.textContent = c.hex;
                d.appendChild(b);
                d.onclick = function (e) {
                    e.stopPropagation();
                    copyHex(c.hex);
                };
                sw.appendChild(d);
            });
            var info = document.createElement('div');
            info.className = 'pal-info';
            info.innerHTML = '<div class="pal-name">' + sc.name + '</div><div class="pal-desc">' + sc.desc + '</div>';
            var acts = document.createElement('div');
            acts.className = 'pal-actions';
            var favBtn = document.createElement('button');
            favBtn.className = 'cy-btn cy-btn-sm cy-btn-ghost';
            favBtn.textContent = '⭐ 收藏';
            favBtn.onclick = function (e) {
                e.stopPropagation();
                saveFav({ name: sc.name, colors: sc.colors.map(function (c) { return c.hex; }), desc: sc.desc, base: baseHex });
            };
            var cssBtn = document.createElement('button');
            cssBtn.className = 'cy-btn cy-btn-sm cy-btn-ghost';
            cssBtn.textContent = '🧬 导出CSS';
            cssBtn.onclick = function (e) {
                e.stopPropagation();
                exportCss(sc);
            };
            acts.appendChild(favBtn);
            acts.appendChild(cssBtn);
            card.appendChild(sw);
            card.appendChild(info);
            card.appendChild(acts);
            row.appendChild(card);
        });
    }

    function copyHex(h) {
        try {
            navigator.clipboard.writeText(h).then(function () { CY.showToast('已复制 ' + h); }).catch(function () {});
        } catch (e) {}
    }

    /* ========== 收藏夹 ========== */
    function readFavs() { try { var a = JSON.parse(localStorage.getItem('cy_fav_palettes')); if (Object.prototype.toString.call(a) === '[object Array]') return a; } catch (e) {} return []; }
    function saveFav(p) {
        var a = readFavs();
        a.push(p);
        try { localStorage.setItem('cy_fav_palettes', JSON.stringify(a)); } catch (e) {}
        CY.showToast('⭐ 已收藏「' + p.name + '」方案');
        _palGen++;
        if (_palGen >= 10) CY.unlock('palette_10');
        if (typeof CY.activity === 'object' && CY.activity.add) CY.activity.add({ type: 'save_palette', page: '5.html', itemId: p.name });
    }
    function openFavs() {
        var a = readFavs();
        if (!a.length) { CY.showToast('收藏夹还是空的，先点「⭐ 收藏」吧'); return; }
        if (document.getElementById('cyFavPanel')) document.getElementById('cyFavPanel').remove();
        var panel = document.createElement('div');
        panel.id = 'cyFavPanel';
        panel.style.cssText = 'position:fixed;bottom:76px;right:20px;width:min(340px,88vw);max-height:52vh;overflow-y:auto;z-index:2147483646;background:var(--card,#fff);color:var(--txt,#333);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.4);padding:10px 0;';
        var head = document.createElement('div');
        head.style.cssText = 'padding:8px 16px;font-size:14px;font-weight:bold;color:var(--blue,#667eea);border-bottom:1px solid var(--line,#eee);display:flex;justify-content:space-between;align-items:center;';
        head.innerHTML = '⭐ 收藏的配色<button id="cyFavClose" style="border:none;background:none;font-size:18px;cursor:pointer;color:var(--dim,#999);">✕</button>';
        panel.appendChild(head);
        a.slice().reverse().forEach(function (p, i) {
            var row = document.createElement('div');
            row.style.cssText = 'padding:10px 16px;border-bottom:1px solid var(--line,#f3f3f3);';
            var sw = document.createElement('div');
            sw.style.cssText = 'display:flex;height:30px;border-radius:6px;overflow:hidden;margin-bottom:6px;cursor:pointer;';
            p.colors.forEach(function (h) {
                var d = document.createElement('div');
                d.style.cssText = 'flex:1;background:' + h;
                d.title = h;
                d.onclick = function (e) { e.stopPropagation(); copyHex(h); };
                sw.appendChild(d);
            });
            var meta = document.createElement('div');
            meta.style.cssText = 'font-size:12px;color:var(--dim,#888);display:flex;justify-content:space-between;align-items:center;';
            meta.innerHTML = '<span>' + p.name + ' · ' + p.colors.length + ' 色</span><button data-del="1" style="border:none;background:none;color:#dc2626;cursor:pointer;font-size:12px;">删除</button>';
            meta.querySelector('[data-del]').onclick = function (e) {
                e.stopPropagation();
                var list = readFavs();
                list.splice(list.length - 1 - i, 1);
                try { localStorage.setItem('cy_fav_palettes', JSON.stringify(list)); } catch (e2) {}
                panel.remove();
                openFavs();
            };
            row.appendChild(sw);
            row.appendChild(meta);
            panel.appendChild(row);
        });
        document.body.appendChild(panel);
        document.getElementById('cyFavClose').onclick = function () { panel.remove(); };
    }

    /* ========== 导出 CSS 变量 ========== */
    function exportCss(sc) {
        var lines = ['/* 创意引擎 · ' + sc.name + '配色方案（基准色 ' + sc.base + '） */', ':root {'];
        sc.colors.forEach(function (c, i) {
            lines.push('  --pal-' + (i + 1) + ': ' + c.hex + ';');
        });
        lines.push('}');
        lines.push('');
        lines.push('/* 用法示例 */');
        lines.push('.my-card { background: var(--pal-1); color: var(--pal-2); }');
        var text = lines.join('\n');
        try {
            navigator.clipboard.writeText(text).then(function () {
                CY.showToast('🧬 CSS 变量已复制');
            }).catch(function () { CY.download('palette-' + sc.name + '.css', text); });
        } catch (e) { CY.download('palette-' + sc.name + '.css', text); }
    }

    /* ========== 对比度检测 ========== */
    function renderContrast() {
        var fgH = document.getElementById('fgHex').value.trim();
        var bgH = document.getElementById('bgHex').value.trim();
        if (!/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(fgH)) { fgH = '#ffffff'; }
        if (!/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(bgH)) { bgH = '#6366f1'; }
        document.getElementById('fgColor').value = fgH;
        document.getElementById('bgColor').value = bgH;
        var fg = hexToRgb(fgH), bg = hexToRgb(bgH);
        var ratio = contrastRatio(fg, bg);
        var r = ratingOf(ratio);
        var el = document.getElementById('ctResult');
        el.innerHTML = '对比度 <b style="font-size:22px;">' + ratio.toFixed(2) + ':1</b>　' +
            '<span class="ct-badge ' + r.cls + '">' + r.badge + '</span><span>' + r.txt + '</span><br>' +
            '<span style="color:var(--zl-dim);font-size:12px;">计算公式：两个颜色的相对亮度 (L1+0.05)/(L2+0.05)，源自 WCAG 2.1 §1.4.3</span>';
        var sample = document.getElementById('ctSample');
        sample.style.background = bgH;
        sample.style.color = fgH;
    }

    /* ========== 事件绑定 ========== */
    function normalizeHex(input) {
        var v = input.value.trim();
        if (/^[0-9a-fA-F]{3}$/.test(v)) v = '#' + v;
        if (/^[0-9a-fA-F]{6}$/.test(v)) v = '#' + v;
        if (/^#[0-9a-fA-F]{3}$/.test(v)) { v = '#' + v[1] + v[1] + v[2] + v[2] + v[3] + v[3]; }
        input.value = v;
        return v;
    }
    function bindHexColor(colorInput, hexInput, onChange) {
        colorInput.addEventListener('input', function () { hexInput.value = this.value; onChange(this.value); });
        hexInput.addEventListener('change', function () { var v = normalizeHex(this); colorInput.value = v; onChange(v); });
        hexInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { var v = normalizeHex(this); colorInput.value = v; onChange(v); }
        });
    }

    function genBase() {
        var h = Math.floor(Math.random() * 360);
        var s = 35 + Math.floor(Math.random() * 55);
        var l = 30 + Math.floor(Math.random() * 45);
        var hex = hslHex(h, s, l);
        document.getElementById('baseColor').value = hex;
        document.getElementById('baseHex').value = hex;
        _palGen++;
        renderPalettes(hex);
        if (_palGen >= 10) CY.unlock('palette_10');
        if (typeof CY.activity === 'object' && CY.activity.add) CY.activity.add({ type: 'gen_palette', page: '5.html' });
    }

    document.getElementById('btnGen').onclick = genBase;
    document.getElementById('btnFavs').onclick = openFavs;
    document.getElementById('btnPick').onclick = function () {
        var fg = prompt('输入前景色（用于文字/图标）', '#ffffff');
        if (fg && /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(fg)) {
            document.getElementById('fgHex').value = fg;
            document.getElementById('fgColor').value = fg;
        }
        renderContrast();
    };
    bindHexColor(document.getElementById('baseColor'), document.getElementById('baseHex'), renderPalettes);
    bindHexColor(document.getElementById('fgColor'), document.getElementById('fgHex'), function () { renderContrast(); });
    bindHexColor(document.getElementById('bgColor'), document.getElementById('bgHex'), function () { renderContrast(); });

    renderPalettes(document.getElementById('baseHex').value);
    renderContrast();
    if (typeof CY.activity === 'object' && CY.activity.add) CY.activity.add({ type: 'open_tool', page: '5.html' });
    </script>
</body>
</html>
