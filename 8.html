<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>目标拆解·SMART里程碑规划｜创意引擎</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon-48.png">
    <link rel="canonical" href="https://your-name.github.io/creativity/8.html">
    <style>
        .smart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 12px; }
        .smart-item { border: 1px solid var(--zl-border); border-radius: 12px; padding: 12px; background: var(--zl-card-2); cursor: pointer; transition: all .15s; }
        .smart-item.on { border-color: #16a34a; background: rgba(22,163,74,.08); }
        .smart-item.off { opacity: .55; }
        .smart-item .letter { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, var(--zl-accent), var(--zl-accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .smart-item .tt { font-size: 13px; font-weight: 700; color: var(--zl-text); margin-top: 2px; }
        .smart-item .ds { font-size: 12px; color: var(--zl-dim); margin-top: 4px; line-height: 1.6; }
        .smart-item .st { font-size: 11px; margin-top: 6px; font-weight: 700; }
        .st.ok { color: #16a34a; }
        .st.no { color: var(--zl-dim); }
        .ms-row { display: grid; grid-template-columns: 1fr 150px auto; gap: 8px; margin-top: 8px; align-items: center; }
        .gantt { margin-top: 14px; position: relative; }
        .gantt-line { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 10px; margin-top: 10px; }
        .gantt-name { font-size: 13px; color: var(--zl-text); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gantt-track { height: 22px; background: var(--zl-card-2); border-radius: 6px; position: relative; }
        .gantt-bar { position: absolute; top: 2px; height: 18px; border-radius: 5px; background: linear-gradient(90deg, var(--zl-accent), var(--zl-accent-2)); min-width: 4px; }
        .gantt-bar.done { background: linear-gradient(90deg,#16a34a,#22c55e); }
        .gantt-marker { position: absolute; top: -2px; width: 2px; height: 26px; background: var(--zl-accent-2); opacity: .8; }
        .ms-list .ms-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; margin-top: 6px; background: var(--zl-card-2); font-size: 13px; color: var(--zl-text); }
        .ms-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: #16a34a; cursor: pointer; }
        .ms-item.done { text-decoration: line-through; opacity: .6; }
    </style>

    <link rel="stylesheet" href="common.css">
    <script>
        try {
            var _ct = localStorage.getItem('cy_theme');
            var _ok = ['dark','blue','gold','light','milk','guofeng','snowsun','cyber','aurora','custom'];
            if (_ct && _ok.indexOf(_ct) >= 0) { document.documentElement.setAttribute('data-theme', _ct); }
        } catch (e) {}
    </script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="创意引擎">
    <meta name="description" content="SMART 目标自检 + 里程碑拆解 + 甘特时间轴：把大目标拆成可执行的小步，随时回看进度。">
    <link rel="stylesheet" href="common.css">
    <script defer src="common.js"></script>
    <script defer src="theme.js"></script>
    <script defer src="cy-features.js"></script>
</head>
<body>

    <div class="bg-animation">
        <div class="bg-flow-1"></div>
        <div class="bg-flow-2"></div>
        <div class="bg-flow-3"></div>
    </div>

    <header class="cy-shell">
        <h1>创意引擎 · 目标拆解</h1>
    </header>

    <main class="cy-page">
        <div class="cy-card">
            <h2>🎯 我的目标</h2>
            <div class="sub">先写下目标，再逐项拆解。系统会用 SMART 原则帮你做「目标体检」。</div>
            <input class="cy-input" id="goalName" placeholder="目标名称，如：三个月内发布个人作品集网站">
            <div class="cy-toolbar">
                <input class="cy-input" type="date" id="goalDate" style="width:170px;">
                <input class="cy-input" id="goalNum" placeholder="衡量数字，如：12 个作品" style="flex:1;">
                <button class="cy-btn cy-btn-ghost" id="btnExampleGoal">🧪 示例</button>
            </div>
        </div>

        <div class="cy-card">
            <h2>🧪 SMART 目标体检</h2>
            <div class="sub">点一下方格切换状态；系统会结合你的目标文字自动给出建议。</div>
            <div class="smart-grid" id="smartGrid"></div>
            <div class="hint" id="smartAdvice" style="font-size:13px;color:var(--zl-text);margin-top:10px;line-height:1.8;"></div>
        </div>

        <div class="cy-card">
            <h2>🧱 里程碑拆解</h2>
            <div class="sub">把大目标拆成 3-6 个里程碑，每个里程碑设一个期限，甘特图自动排布。</div>
            <div class="ms-row">
                <input class="cy-input" id="msName" placeholder="里程碑名称，如：完成选题与结构">
                <input class="cy-input" type="date" id="msDate">
                <button class="cy-btn" id="btnAddMs">＋ 添加</button>
            </div>
            <div class="ms-list" id="msList"></div>
            <div class="gantt" id="gantt"></div>
        </div>

        <div class="cy-card">
            <h2>📤 导出与保存</h2>
            <div class="cy-toolbar">
                <button class="cy-btn" id="btnExport">📄 导出计划（Markdown）</button>
                <button class="cy-btn cy-btn-ghost" id="btnSave">💾 存为本页草稿</button>
                <button class="cy-btn cy-btn-ghost" id="btnLoad">📂 载入草稿</button>
            </div>
        </div>
    </main>

    <script>
    /* ========== 目标拆解引擎 ========== */
    var plan = {
        goal: '', date: '', num: '', smart: { S: true, M: false, A: true, R: true, T: false },
        ms: [] // {name, date, done}
    };
    var SMART = [
        { k: 'S', tt: '具体 Specific', ds: '目标是否清晰可描述？模糊的「变好」无法执行。' },
        { k: 'M', tt: '可衡量 Measurable', ds: '有没有可验证的数字或标准？' },
        { k: 'A', tt: '可达成 Achievable', ds: '以你的资源与时间，这目标现实吗？' },
        { k: 'R', tt: '相关 Relevant', ds: '它与你更大的方向一致吗？' },
        { k: 'T', tt: '有时限 Time-bound', ds: '有明确的截止日期吗？' }
    ];

    function renderSmart() {
        var grid = document.getElementById('smartGrid');
        grid.innerHTML = '';
        SMART.forEach(function (s) {
            var on = plan.smart[s.k];
            var it = document.createElement('div');
            it.className = 'smart-item ' + (on ? 'on' : 'off');
            it.innerHTML = '<div class="letter">' + s.k + '</div><div class="tt">' + s.tt + '</div><div class="ds">' + s.ds + '</div>' +
                '<div class="st ' + (on ? 'ok' : 'no') + '">' + (on ? '✓ 已达标' : '○ 待完善') + '</div>';
            it.onclick = function () { plan.smart[s.k] = !plan.smart[s.k]; renderSmart(); };
            grid.appendChild(it);
        });
        // 建议
        var advice = document.getElementById('smartAdvice');
        var tips = [];
        var goal = plan.goal.trim();
        if (!goal) tips.push('⚠ 还没有目标文字：SMART 全部依赖目标描述，先补上「目标名称」。');
        else {
            if (!/\d/.test(goal)) tips.push('💡 目标里没有数字：建议加入可衡量的指标，如「每周发布 2 篇」「积累 1000 个访问」——这会让 M（可衡量）自动点亮。');
            if (!plan.date) tips.push('💡 还没设定截止日期：给目标加一个「截止日」，T（有时限）才成立，拖延感会明显减轻。');
        }
        var onCount = Object.keys(plan.smart).filter(function (k) { return plan.smart[k]; }).length;
        if (onCount >= 4 && !tips.length) tips.push('🎉 全部关键项已达标：目标清晰、有数字、有期限，可以放心拆里程碑了。');
        if (!tips.length) tips.push('✅ 目标体检通过：具体、可衡量、有时限——像这样的目标成功率最高。');
        advice.innerHTML = tips.join('<br>');
    }

    /* ---------- 里程碑 ---------- */
    function renderMs() {
        var list = document.getElementById('msList');
        list.innerHTML = '';
        plan.ms.forEach(function (m, i) {
            var item = document.createElement('div');
            item.className = 'ms-item' + (m.done ? ' done' : '');
            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = m.done;
            cb.onchange = function () { m.done = this.checked; renderMs(); };
            var nm = document.createElement('span');
            nm.style.flex = '1';
            nm.textContent = m.name;
            var dt = document.createElement('span');
            dt.style.cssText = 'font-size:12px;color:var(--zl-dim);white-space:nowrap;';
            dt.textContent = m.date || '待定';
            var del = document.createElement('button');
            del.className = 'cy-btn cy-btn-sm cy-btn-ghost';
            del.textContent = '🗑';
            del.onclick = function () { plan.ms.splice(i, 1); renderMs(); };
            item.appendChild(cb); item.appendChild(nm); item.appendChild(dt); item.appendChild(del);
            list.appendChild(item);
        });
        renderGantt();
    }

    function renderGantt() {
        var g = document.getElementById('gantt');
        if (!plan.ms.length) { g.innerHTML = '<div class="sub" style="color:var(--zl-dim);">添加里程碑后自动生成甘特时间轴。</div>'; return; }
        var start = new Date(), end = new Date(plan.date || Date.now() + 90 * 864e5);
        if (end < start) end = new Date(start.getTime() + 90 * 864e5);
        // 以今天为起点、目标截止日为终点；里程碑按日期区间在刻度内均分
        var total = end.getTime() - start.getTime();
        var span = total || 90 * 864e5;
        var html = '';
        var markerPct = 0; // 今天即起点
        plan.ms.forEach(function (m, i) {
            var pct = (m.date ? (new Date(m.date).getTime() - start.getTime()) / span : (i + 1) / plan.ms.length) * 100;
            pct = Math.max(1, Math.min(99, pct));
            html += '<div class="gantt-line"><div class="gantt-name" title="' + escapeHtml(m.name) + '">' + escapeHtml(m.name) + '</div>' +
                '<div class="gantt-track">' +
                '<div class="gantt-bar ' + (m.done ? 'done' : '') + '" style="left:' + (pct * 0.86) + '%;width:' + Math.max(5, pct * 0.14) + '%"></div>' +
                '</div></div>';
        });
        html += '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--zl-dim);margin-top:6px;"><span>今天</span><span>' + (plan.date || '目标截止日') + '</span></div>';
        g.innerHTML = html;
    }

    /* ---------- 草稿与导出 ---------- */
    function saveDraft() {
        try { localStorage.setItem('cy_plan_draft', JSON.stringify(plan)); CY.showToast('💾 草稿已保存到本页'); } catch (e) { CY.showToast('保存失败'); }
    }
    function loadDraft() {
        try {
            var d = JSON.parse(localStorage.getItem('cy_plan_draft'));
            if (d && d.ms) {
                plan = d;
                document.getElementById('goalName').value = plan.goal;
                document.getElementById('goalDate').value = plan.date || '';
                document.getElementById('goalNum').value = plan.num || '';
                renderSmart();
                renderMs();
                CY.showToast('📂 草稿已载入');
            } else { CY.showToast('暂无草稿'); }
        } catch (e) { CY.showToast('草稿损坏'); }
    }
    function exportPlan() {
        var lines = ['# ' + (plan.goal || '我的目标'), ''];
        if (plan.num) lines.push('**衡量标准：** ' + plan.num);
        if (plan.date) lines.push('**截止日期：** ' + plan.date);
        lines.push('', '## SMART 体检', '');
        SMART.forEach(function (s) {
            lines.push('- [' + (plan.smart[s.k] ? 'x' : ' ') + '] ' + s.tt + '：' + s.ds);
        });
        lines.push('', '## 里程碑', '');
        if (!plan.ms.length) lines.push('（暂无里程碑）');
        plan.ms.forEach(function (m, i) {
            lines.push((i + 1) + '. ' + (m.done ? '[x]' : '[ ]') + ' ' + m.name + (m.date ? '（' + m.date + '）' : ''));
        });
        var text = lines.join('\n');
        try {
            navigator.clipboard.writeText(text).then(function () { CY.showToast('📄 计划已复制'); }).catch(function () { CY.download('plan.md', text, 'text/markdown'); });
        } catch (e) { CY.download('plan.md', text, 'text/markdown'); }
    }

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
    }

    /* ---------- 事件绑定 ---------- */
    document.getElementById('goalName').addEventListener('input', function () { plan.goal = this.value; renderSmart(); });
    document.getElementById('goalDate').addEventListener('change', function () { plan.date = this.value; renderSmart(); renderGantt(); });
    document.getElementById('goalNum').addEventListener('input', function () { plan.num = this.value; });
    document.getElementById('btnAddMs').onclick = function () {
        var name = document.getElementById('msName').value.trim();
        var date = document.getElementById('msDate').value;
        if (!name) { CY.showToast('先给里程碑起个名字'); return; }
        plan.ms.push({ name: name, date: date, done: false });
        document.getElementById('msName').value = '';
        document.getElementById('msDate').value = '';
        renderMs();
    };
    document.getElementById('btnExampleGoal').onclick = function () {
        plan.goal = '三个月内上线个人作品集网站并积累 1000 次访问';
        plan.num = '1000 次访问 / 12 个作品';
        plan.date = (function () { var d = new Date(); d.setDate(d.getDate() + 90); var m = d.getMonth() + 1, dd = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (dd < 10 ? '0' + dd : dd); })();
        plan.smart = { S: true, M: true, A: true, R: true, T: true };
        plan.ms = [
            { name: '选题与整体结构', date: '', done: true },
            { name: '设计系统与首页', date: '', done: false },
            { name: '12 个作品全部完成', date: '', done: false },
            { name: '上线并提交到收录', date: '', done: false }
        ];
        document.getElementById('goalName').value = plan.goal;
        document.getElementById('goalNum').value = plan.num;
        document.getElementById('goalDate').value = plan.date;
        renderSmart();
        renderMs();
        CY.showToast('🧪 示例计划已载入');
        if (typeof CY.activity === 'object' && CY.activity.add) CY.activity.add({ type: 'plan', page: '8.html' });
        CY.unlock('plan_first');
    };
    document.getElementById('btnSave').onclick = saveDraft;
    document.getElementById('btnLoad').onclick = loadDraft;
    document.getElementById('btnExport').onclick = exportPlan;

    /* 初始化 */
    renderSmart();
    renderMs();
    if (typeof CY.activity === 'object' && CY.activity.add) CY.activity.add({ type: 'open_tool', page: '8.html' });
    </script>
</body>
</html>
